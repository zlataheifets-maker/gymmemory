
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GymMemory 3.0</title>
<style>
:root {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  color: #17233e;
  background: #f3f6fc;
}
* { box-sizing: border-box; }
body { margin: 0; padding: 15px; }
header {
  max-width: 1300px;
  margin: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
h1 { font-size: 28px; margin: 12px 0; }
button, select, input { font: inherit; }
button {
  border: 0;
  background: #2868ee;
  color: white;
  padding: 11px 15px;
  border-radius: 12px;
  cursor: pointer;
}
button.secondary { background: #e7edfa; color: #2452a5; }
button.selected { outline: 3px solid #6ba0ff; }
button:disabled { opacity: .5; }
.panel {
  background: white;
  border-radius: 18px;
  padding: 14px;
  box-shadow: 0 3px 15px #253b6510;
}
.layout {
  max-width: 1300px;
  margin: 12px auto;
  display: grid;
  grid-template-columns: 1.65fr 1fr;
  gap: 14px;
}
.cameraBox {
  background: #101725;
  border-radius: 16px;
  overflow: hidden;
  position: relative;
  min-height: 260px;
}
video {
  width: 100%;
  display: block;
  transform: scaleX(-1);
}
#overlay {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  transform: scaleX(-1);
  pointer-events: none;
}
#target {
  position: absolute;
  z-index: 3;
  display: none;
  font-size: 44px;
  transform: translate(-50%, -50%);
  filter: drop-shadow(0 0 9px white);
  pointer-events: none;
}
#target.hit { animation: pop .35s ease-out; }
@keyframes pop {
  50% { transform: translate(-50%, -50%) scale(1.7); opacity: .4; }
  100% { transform: translate(-50%, -50%) scale(.2); opacity: 0; }
}
.trainerBox {
  background: linear-gradient(150deg, #e9f0fc, #d8e4f6);
  border-radius: 16px;
  min-height: 400px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  padding: 12px;
}
#trainer {
  width: 100%;
  max-width: 340px;
  height: 360px;
}
#leftArm, #rightArm, #leftLeg, #rightLeg {
  transition: transform 1s ease-in-out;
  transform-box: fill-box;
  transform-origin: center top;
}
.controls {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
}
.status { font-size: 14px; margin: 8px 0; overflow-wrap: anywhere; }
.ok { color: #14834b; }
.error { color: #b52d38; }
.small { color: #687690; font-size: 13px; }
.choices {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 10px;
}
.choice {
  background: #eef3fc;
  color: #213b68;
  min-width: 65px;
}
.choice.active { background: #2868ee; color: white; }
select {
  padding: 10px;
  border: 1px solid #ccd5e5;
  border-radius: 10px;
}
.progress {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}
.dot {
  width: 13px;
  height: 13px;
  border-radius: 50%;
  background: #d4dceb;
}
.dot.done { background: #2868ee; }
.bottom {
  max-width: 1300px;
  margin: 12px auto;
}
@media(max-width: 800px) {
  .layout { grid-template-columns: 1fr; }
  .trainerBox { min-height: 340px; }
  #trainer { height: 300px; }
}
</style>
</head>
<body>

<header>
  <h1>🤸 GymMemory 3.0</h1>
  <div class="controls">
    <button id="soundBtn" class="secondary">🔊 Голос включён</button>
    <button id="cameraBtn">📷 Включить камеру</button>
    <button id="stopCameraBtn" class="secondary">Выключить</button>
  </div>
</header>

<main class="layout">
  <section class="panel">
    <div id="cameraStatus" class="status">Камера выключена.</div>
    <div id="modelStatus" class="status small">Распознавание не загружено.</div>
    <div class="cameraBox" id="cameraBox">
      <video id="video" autoplay muted playsinline></video>
      <canvas id="overlay"></canvas>
      <div id="target">⭐</div>
    </div>
    <p class="small">
      🟢 Правильно · 🔴 Исправь положение · ⚪ Камера не видит сустав
    </p>
  </section>

  <section class="panel">
    <div class="trainerBox">
      <div class="controls">
        <button id="girlBtn" class="secondary selected">👧 Девочка</button>
        <button id="boyBtn" class="secondary">👦 Мальчик</button>
      </div>

      <svg id="trainer" viewBox="0 0 300 390"
           xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="150" cy="374" rx="63" ry="9" fill="#bdcce1"/>
        <g id="leftLeg">
          <path d="M136 220 L133 320 L126 360"
                stroke="#334155" stroke-width="27"
                stroke-linecap="round" fill="none"/>
          <ellipse cx="124" cy="363" rx="19" ry="9" fill="white"/>
        </g>
        <g id="rightLeg">
          <path d="M164 220 L167 320 L174 360"
                stroke="#334155" stroke-width="27"
                stroke-linecap="round" fill="none"/>
          <ellipse cx="176" cy="363" rx="19" ry="9" fill="white"/>
        </g>
        <path d="M121 129 Q150 120 179 129 L175 233
                 Q150 244 125 233 Z"
              fill="#43536d"/>
        <path d="M139 110 L139 132 M161 110 L161 132"
              stroke="#e7b395" stroke-width="13"/>
        <g id="leftArm">
          <path d="M125 142 L88 196 L73 243"
                stroke="#43536d" stroke-width="22"
                stroke-linecap="round" fill="none"/>
          <circle cx="73" cy="244" r="10" fill="#e7b395"/>
        </g>
        <g id="rightArm">
          <path d="M175 142 L212 196 L227 243"
                stroke="#43536d" stroke-width="22"
                stroke-linecap="round" fill="none"/>
          <circle cx="227" cy="244" r="10" fill="#e7b395"/>
        </g>
        <g id="hairBack">
          <path d="M117 77 Q113 23 150 23 Q187 23 183 77
                   L182 105 L118 105 Z"
                fill="#5a3c31"/>
        </g>
        <ellipse cx="150" cy="76" rx="33" ry="42" fill="#e7b395"/>
        <path id="hairFront"
              d="M118 69 Q112 33 146 29 Q183 27 182 66
                 Q167 53 153 48 Q137 64 118 69"
              fill="#5a3c31"/>
        <circle cx="138" cy="78" r="2.5" fill="#293344"/>
        <circle cx="162" cy="78" r="2.5" fill="#293344"/>
        <path d="M142 94 Q150 100 158 94"
              fill="none" stroke="#b56d68"
              stroke-width="2" stroke-linecap="round"/>
      </svg>

      <div id="trainerHint" class="small">
        Тренер готов показать движение
      </div>
    </div>
  </section>
</main>

<section class="panel bottom">
  <h3>🎮 Игровая тренировка</h3>
  <div class="controls">
    <button id="startTraining">▶ Начать программу</button>
    <button id="nextExercise" class="secondary">Следующее движение</button>
    <button id="stopTraining" class="secondary">Завершить</button>
  </div>

  <p class="small">
    Выбери предмет, которого ребёнок будет касаться рукой.
  </p>
  <div class="choices" id="objectChoices">
    <button class="choice active" data-object="⭐">⭐ Звезда</button>
    <button class="choice" data-object="🎈">🎈 Шар</button>
    <button class="choice" data-object="⚽">⚽ Мяч</button>
    <button class="choice" data-object="🧸">🧸 Мишка</button>
  </div>

  <div class="progress" id="progress"></div>
  <p id="gameStatus" class="status">
    Нажми «Начать программу».
  </p>
</section>

<script type="module">
const $ = id => document.getElementById(id);

const video = $("video");
const canvas = $("overlay");
const ctx = canvas.getContext("2d");

let stream = null;
let model = null;
let cameraRunning = false;
let lastTime = -1;
let landmarks = null;
let session = 0;
let soundOn = true;
let trainerGender = "girl";
let objectEmoji = "⭐";
let training = false;
let exerciseIndex = 0;
let trainingTimer = null;
let targetPosition = null;
let targetHit = false;

const exercises = [
  { name: "Руки в стороны", voice: "Разведи руки в стороны", pose: "side" },
  { name: "Руки вверх", voice: "Подними руки вверх", pose: "up" },
  { name: "Руки вниз", voice: "Опусти руки", pose: "down" },
  { name: "Руки в стороны", voice: "Снова разведи руки в стороны", pose: "side" },
  { name: "Руки вверх", voice: "Ещё раз подними руки вверх", pose: "up" }
];

function speak(text) {
  if (!soundOn || !("speechSynthesis" in window)) return;

  speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "ru-RU";
  utterance.rate = 0.85;
  utterance.pitch = 1.05;

  const voices = speechSynthesis.getVoices();
  const russianVoice = voices.find(v => v.lang.startsWith("ru"));
  if (russianVoice) utterance.voice = russianVoice;

  speechSynthesis.speak(utterance);
}

$("soundBtn").onclick = () => {
  soundOn = !soundOn;
  $("soundBtn").textContent = soundOn
    ? "🔊 Голос включён"
    : "🔇 Голос выключен";

  if (!soundOn && "speechSynthesis" in window) {
    speechSynthesis.cancel();
  }
};

function setGender(gender) {
  trainerGender = gender;
  $("girlBtn").classList.toggle("selected", gender === "girl");
  $("boyBtn").classList.toggle("selected", gender === "boy");

  $("hairBack").style.display = gender === "girl" ? "" : "none";

  $("hairFront").setAttribute(
    "d",
    gender === "girl"
      ? "M118 69 Q112 33 146 29 Q183 27 182 66 Q167 53 153 48 Q137 64 118 69"
      : "M118 60 Q120 34 148 35 Q176 34 182 59 Q166 48 150 48 Q135 54 118 60"
  );
}

$("girlBtn").onclick = () => setGender("girl");
$("boyBtn").onclick = () => setGender("boy");

function animateTrainer(pose) {
  const left = $("leftArm");
  const right = $("rightArm");

  if (pose === "up") {
    left.style.transform = "rotate(155deg)";
    right.style.transform = "rotate(-155deg)";
  } else if (pose === "side") {
    left.style.transform = "rotate(65deg)";
    right.style.transform = "rotate(-65deg)";
  } else {
    left.style.transform = "rotate(0deg)";
    right.style.transform = "rotate(0deg)";
  }
}

function updateProgress() {
  $("progress").innerHTML = "";

  exercises.forEach((_, i) => {
    const dot = document.createElement("div");
    dot.className = "dot" + (i <= exerciseIndex && training ? " done" : "");
    $("progress").appendChild(dot);
  });
}

function setTargetVisible(visible) {
  $("target").style.display = visible ? "block" : "none";
}

function positionTarget() {
  targetHit = false;

  const pose = exercises[exerciseIndex]?.pose || "side";

  if (pose === "up") {
    targetPosition = { x: 0.73, y: 0.18 };
  } else if (pose === "down") {
    targetPosition = { x: 0.72, y: 0.78 };
  } else {
    targetPosition = { x: 0.82, y: 0.48 };
  }

  $("target").textContent = objectEmoji;
  $("target").style.left = (targetPosition.x * 100) + "%";
  $("target").style.top = (targetPosition.y * 100) + "%";
  $("target").classList.remove("hit");
  setTargetVisible(true);
}

function showExercise() {
  if (!training || exerciseIndex >= exercises.length) return;

  const exercise = exercises[exerciseIndex];

  animateTrainer(exercise.pose);
  $("trainerHint").textContent =
    "Движение " + (exerciseIndex + 1) + " из " + exercises.length;

  $("gameStatus").textContent =
    "Выполняется упражнение " +
    (exerciseIndex + 1) + " из " + exercises.length;

  updateProgress();
  positionTarget();
  speak(exercise.voice);

  clearTimeout(trainingTimer);
  trainingTimer = setTimeout(() => {
    if (training) nextExercise();
  }, 9000);
}

function nextExercise() {
  if (!training) return;

  exerciseIndex++;

  if (exerciseIndex >= exercises.length) {
    finishTraining(true);
    return;
  }

  showExercise();
}

function finishTraining(completed) {
  training = false;
  clearTimeout(trainingTimer);
  setTargetVisible(false);

  $("gameStatus").textContent = completed
    ? "🎉 Программа завершена!"
    : "Тренировка остановлена.";

  $("trainerHint").textContent = "Тренер отдыхает";

  if (completed) speak("Молодец! Тренировка завершена!");
  updateProgress();
}

$("startTraining").onclick = () => {
  if (!cameraRunning) {
    $("gameStatus").textContent = "Сначала включи камеру.";
    speak("Сначала включи камеру");
    return;
  }

  training = true;
  exerciseIndex = 0;
  showExercise();
};

$("nextExercise").onclick = nextExercise;
$("stopTraining").onclick = () => finishTraining(false);

document.querySelectorAll("[data-object]").forEach(button => {
  button.onclick = () => {
    objectEmoji = button.dataset.object;

    document.querySelectorAll("[data-object]").forEach(b => {
      b.classList.toggle("active", b === button);
    });

    if (training) positionTarget();
  };
});

async function startCamera() {
  if (cameraRunning) return;

  const currentSession = ++session;

  $("cameraStatus").textContent = "Запрашиваю камеру...";

  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: "user",
        width: { ideal: 640 },
        height: { ideal: 480 }
      }
    });

    if (currentSession !== session) {
      stream.getTracks().forEach(t => t.stop());
      return;
    }

    video.srcObject = stream;
    await video.play();

    cameraRunning = true;
    canvas.width = video.videoWidth || 640;
    canvas.height = video.videoHeight || 480;

    $("cameraStatus").textContent = "✅ Камера работает!";
    $("cameraStatus").className = "status ok";

    requestAnimationFrame(loop);
    loadPoseModel(currentSession);

  } catch (error) {
    $("cameraStatus").textContent =
      "❌ Ошибка камеры: " + error.message;
    $("cameraStatus").className = "status error";
  }
}

async function loadPoseModel(currentSession) {
  if (model) {
    $("modelStatus").textContent = "✅ Модель готова.";
    return;
  }

  try {
    $("modelStatus").textContent = "Загружаю MediaPipe...";

    const vision = await import(
      "https://unpkg.com/@mediapipe/tasks-vision@0.10.35/vision_bundle.mjs"
    );

    if (currentSession !== session) return;

    const { FilesetResolver, PoseLandmarker } = vision;

    $("modelStatus").textContent = "Загружаю модель тела...";

    const fileset = await FilesetResolver.forVisionTasks(
      "https://unpkg.com/@mediapipe/tasks-vision@0.10.35/wasm"
    );

    if (currentSession !== session) return;

    const createdModel = await PoseLandmarker.createFromOptions(
      fileset,
      {
        baseOptions: {
          modelAssetPath:
            "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
          delegate: "CPU"
        },
        runningMode: "VIDEO",
        numPoses: 1
      }
    );

    if (currentSession !== session) {
      createdModel.close();
      return;
    }

    model = createdModel;
    $("modelStatus").textContent = "✅ Распознавание готово.";

  } catch (error) {
    $("modelStatus").textContent =
      "⚠️ Распознавание недоступно: " + error.message;
  }
}

function angle(a, b, c) {
  const ax = a.x - b.x, ay = a.y - b.y;
  const cx = c.x - b.x, cy = c.y - b.y;
  const dot = ax * cx + ay * cy;
  const length = Math.hypot(ax, ay) * Math.hypot(cx, cy);

  if (!length) return null;

  return Math.acos(
    Math.max(-1, Math.min(1, dot / length))
  ) * 180 / Math.PI;
}

function isVisible(p) {
  return p && (p.visibility ?? 1) >= 0.4;
}

const connections = [
  [11,12], [11,13], [13,15],
  [12,14], [14,16],
  [11,23], [12,24], [23,24],
  [23,25], [25,27],
  [24,26], [26,28]
];

function getArmState(lm, side, pose) {
  const shoulder = side === "left" ? 11 : 12;
  const elbow = side === "left" ? 13 : 14;
  const hip = side === "left" ? 23 : 24;

  if (![shoulder, elbow, hip].every(i => isVisible(lm[i]))) {
    return null;
  }

  const measured = angle(
    lm[elbow], lm[shoulder], lm[hip]
  );

  const target = pose === "up" ? 170 :
                 pose === "side" ? 90 : 15;

  return Math.abs(measured - target) <= 28;
}

function drawSkeleton(lm) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (!lm) return;

  const pose = training
    ? exercises[exerciseIndex]?.pose
    : "side";

  const leftCorrect = getArmState(lm, "left", pose);
  const rightCorrect = getArmState(lm, "right", pose);

  for (const [a, b] of connections) {
    const p1 = lm[a];
    const p2 = lm[b];
    if (!p1 || !p2) continue;

    let color = "#3ee58a";

    if (!isVisible(p1) || !isVisible(p2)) {
      color = "#b4b9c3";
    } else if ([11,13,15].includes(a) && [11,13,15].includes(b)) {
      color = leftCorrect === null ? "#b4b9c3" :
              leftCorrect ? "#3ee58a" : "#ff4c5b";
    } else if ([12,14,16].includes(a) && [12,14,16].includes(b)) {
      color = rightCorrect === null ? "#b4b9c3" :
              rightCorrect ? "#3ee58a" : "#ff4c5b";
    }

    ctx.beginPath();
    ctx.moveTo(p1.x * canvas.width, p1.y * canvas.height);
    ctx.lineTo(p2.x * canvas.width, p2.y * canvas.height);
    ctx.strokeStyle = color;
    ctx.lineWidth = 5;
    ctx.lineCap = "round";
    ctx.stroke();
  }

  for (const i of [11,12,13,14,15,16,23,24,25,26,27,28]) {
    const p = lm[i];
    if (!isVisible(p)) continue;

    ctx.beginPath();
    ctx.arc(p.x * canvas.width, p.y * canvas.height, 5, 0, Math.PI * 2);
    ctx.fillStyle = "white";
    ctx.fill();
  }
}

function checkTarget(lm) {
  if (!training || !targetPosition || targetHit) return;

  const wrists = [lm[15], lm[16]].filter(isVisible);
  if (!wrists.length) return;

  // Target position is displayed on mirrored video.
  const hit = wrists.some(wrist => {
    const displayedX = 1 - wrist.x;
    const distance = Math.hypot(
      displayedX - targetPosition.x,
      wrist.y - targetPosition.y
    );
    return distance < 0.09;
  });

  if (hit) {
    targetHit = true;
    $("target").classList.add("hit");
    speak("Молодец!");

    setTimeout(() => {
      if (targetHit) setTargetVisible(false);
    }, 350);
  }
}

function loop() {
  if (!cameraRunning) return;

  if (
    model &&
    video.readyState >= 2 &&
    video.currentTime !== lastTime
  ) {
    lastTime = video.currentTime;

    try {
      const result = model.detectForVideo(
        video,
        performance.now()
      );

      landmarks = result.landmarks?.[0] || null;
      drawSkeleton(landmarks);

      if (landmarks) {
        checkTarget(landmarks);
        $("modelStatus").textContent =
          "✅ Скелет найден.";
      } else {
        $("modelStatus").textContent =
          "Встань так, чтобы тело было видно.";
      }

    } catch (error) {
      $("modelStatus").textContent =
        "Ошибка распознавания: " + error.message;
    }
  }

  requestAnimationFrame(loop);
}

function stopCamera() {
  session++;
  cameraRunning = false;
  finishTraining(false);

  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }

  video.pause();
  video.srcObject = null;
  landmarks = null;
  lastTime = -1;

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  $("cameraStatus").textContent = "Камера выключена.";
}

$("cameraBtn").onclick = startCamera;
$("stopCameraBtn").onclick = stopCamera;

setGender("girl");
animateTrainer("down");
updateProgress();
</script>
</body>
</html>
